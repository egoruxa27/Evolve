{% extends "base.html" %}

{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
{% endblock extra_css %}

{% block content %}

<main class="profile-card">
    <div class="profile-avatar" aria-hidden="true">
        {{ user.nickname|first|upper }}
    </div>

    <h1 class="profile-title">Профиль</h1>
    <p class="profile-name">{{ user.nickname }}</p>

    <div class="profile-actions">
    {% if request.user == user %}
        <a href="{% url 'users:change_profile' %}" class="profile-button profile-button-primary">
            Изменить профиль
        </a>
        <a href="{% url 'users:change_password' %}" class="profile-button profile-button-secondary">
            Сменить пароль
        </a>
    {% endif %}
    </div>
</main>
{% endblock %}

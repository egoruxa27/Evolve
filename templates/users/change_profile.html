{% extends 'base.html' %}

{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock extra_css %}

{% block content %}

<div class='auth-card'>

    <form method='POST' class='auth-form' novalidate>
        {% csrf_token %}
        {{ form }}
        <button type='submit' class='auth-submit'>Изменить профиль</button>

</div>
{% endblock %}

{% extends "base.html" %}

{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock extra_css %}

{% block content %}

<div class="auth-card">

    <form method="post" class='auth-form' novalidate>
        {% csrf_token %}

        <h2 class='auth-title'>Регистрация</h2>

        {{ form }}

        <button type="submit" class='auth-submit'>
            Зарегистрироваться
        </button>
    </form>

    <p>
        Уже есть аккаунт?
        <a href="{% url 'users:login' %}" class='register-link'>
            Войти
        </a>
    </p>

</div>

{% endblock content %}

{% extends 'base.html' %}

{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">

<div class='auth-card'>

    <form method='POST' class='auth-form'>
        {% csrf_token %}
        {{ form }}
        <button type='submit' class='auth-submit'>Сменить пароль</button>
    </form>

</div>
{% endblock %}

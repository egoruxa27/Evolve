<div class="header">
    <a href="{% url 'tasks:list' %}" class='logo'>Evolve</a>

    {% if request.user.is_authenticated %}
        <form method="POST" action="{% url 'users:logout' %}">
            {% csrf_token %}
            <button type="submit" class='logout-button'>
                Выйти из аккаунта
            </button>
        </form>
        <a href="{% url 'users:profile' %}" class="profile-link">
            <span class="header-avatar" aria-hidden="true">
                {% if request.user.avatar %}
                    <img src="{{ request.user.avatar.url }}" alt="">
                {% else %}
                    {{ request.user.nickname|first|upper }}
                {% endif %}
            </span>
            <span>{{ request.user.nickname }}</span>
        </a>
    {% endif %}
</div>
